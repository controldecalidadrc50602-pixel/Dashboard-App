services:
  - type: web
    name: dashboard-reportes-app
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: dashboard-db
          property: connectionString

databases:
  - name: dashboard-db
    databaseName: dashboard_reportes
    user: rc506_user
    plan: free
