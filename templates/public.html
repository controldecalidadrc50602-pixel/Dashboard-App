<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Informe · Cargando...</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Inter',sans-serif; background:#f4f8fc; color:#1e2a3e; line-height:1.4; }

/* ── Loading / Splash ── */
.splash {
  position:fixed; inset:0; background:linear-gradient(145deg,#004d40,#009688);
  display:flex; align-items:center; justify-content:center; flex-direction:column;
  color:white; text-align:center; z-index:500; transition:opacity 0.5s;
}
.splash h1 { font-size:2.5rem; margin-top:20px; }
.splash p { opacity:0.8; margin-top:8px; }
.spinner { width:48px; height:48px; border:4px solid rgba(255,255,255,0.3);
  border-top-color:white; border-radius:50%; animation:spin 0.8s linear infinite; }
@keyframes spin { to{ transform:rotate(360deg); } }

/* ── Password gate ── */
.password-gate {
  display:none; position:fixed; inset:0; background:linear-gradient(145deg,#004d40,#009688);
  align-items:center; justify-content:center; z-index:400;
}
.pw-card { background:white; border-radius:24px; padding:40px; max-width:400px; width:100%; text-align:center; }
.pw-card h2 { font-size:1.5rem; margin-bottom:8px; }
.pw-card p { color:#64748b; font-size:0.85rem; margin-bottom:24px; }
.pw-card input {
  width:100%; padding:12px 16px; border:2px solid #e2e8f0; border-radius:10px;
  font-size:1rem; margin-bottom:16px; outline:none; font-family:'Inter',sans-serif;
}
.pw-card input:focus { border-color:#009688; }
.pw-card button { width:100%; padding:12px; background:#009688; color:white; border:none;
  border-radius:10px; font-size:1rem; font-weight:700; cursor:pointer; font-family:'Inter',sans-serif; }

/* ── Top header ── */
.pub-header {
  background:linear-gradient(135deg,#004d40,#009688);
  color:white; padding:32px 40px; margin-bottom:0;
}
.pub-header h1 { font-size:2rem; font-weight:800; }
.pub-header .sub { opacity:0.85; margin-top:6px; font-size:1rem; }
.pub-header .badge { display:inline-block; background:rgba(255,255,255,0.2); padding:4px 14px;
  border-radius:20px; font-size:0.75rem; margin-top:12px; }

/* ── Main content ── */
.pub-main { max-width:1300px; margin:0 auto; padding:32px 24px; }

/* ── Tabs ── */
.pub-tabs {
  display:flex; flex-wrap:wrap; gap:8px; margin-bottom:28px;
  background:white; border-radius:16px; padding:10px 16px;
  border:1px solid #e2e8f0; box-shadow:0 2px 6px rgba(0,0,0,0.04);
}
.pub-tab {
  background:none; border:none; padding:10px 22px; font-size:0.85rem;
  font-weight:600; color:#5b6e8c; cursor:pointer; border-radius:10px;
  transition:all 0.2s; font-family:'Inter',sans-serif;
}
.pub-tab.active { background:#e0f2f1; color:#00796b; }
.pub-pane { display:none; animation:fadeIn 0.3s ease; }
.pub-pane.active { display:block; }
@keyframes fadeIn { from{opacity:0;transform:translateY(5px)} to{opacity:1;transform:translateY(0)} }

/* ── Sections ── */
.section { background:white; border-radius:20px; padding:24px; margin-bottom:24px;
  border:1px solid #e2e8f0; box-shadow:0 2px 8px rgba(0,0,0,0.03); }
.section-title { font-size:1.3rem; font-weight:700; margin-bottom:18px;
  display:flex; align-items:center; gap:12px; border-left:5px solid #009688; padding-left:16px; }

/* ── KPI Grid ── */
.kpi-grid { display:flex; flex-wrap:wrap; gap:16px; margin:20px 0; }
.kpi-card { flex:1 1 160px; background:#f9fafb; border-radius:16px; padding:18px;
  text-align:center; border-bottom:3px solid #009688; }
.kpi-number { font-size:1.9rem; font-weight:800; color:#00695c; }
.kpi-label { font-size:0.7rem; text-transform:uppercase; color:#64748b; margin-top:6px; }

/* ── Table ── */
.table-wrap { overflow-x:auto; border-radius:12px; border:1px solid #e2e8f0; margin:16px 0; }
table { width:100%; border-collapse:collapse; font-size:0.82rem; min-width:600px; }
th { background:#f8fafc; padding:10px 12px; font-weight:600; border-bottom:2px solid #e2e8f0;
  text-align:left; color:#475569; font-size:0.76rem; text-transform:uppercase; }
td { padding:9px 12px; border-bottom:1px solid #f1f5f9; }
.trend-up { color:#10b981; font-weight:600; }
.trend-dn { color:#f59e0b; font-weight:600; }

/* ── Charts ── */
.charts-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(360px,1fr)); gap:20px; margin-bottom:24px; }
.chart-card { background:white; border-radius:16px; padding:18px; border:1px solid #e2e8f0; }
.chart-card h3 { font-size:0.95rem; font-weight:600; margin-bottom:12px; }

/* ── Insight ── */
.insight { background:#e0f2f1; border-radius:16px; padding:18px; margin-top:20px; font-size:0.9rem; }

/* ── Footer ── */
footer { text-align:center; padding:32px; font-size:0.78rem; color:#94a3b8;
  border-top:1px solid #e2e8f0; margin-top:20px; }

/* ── Error state ── */
.error-state { text-align:center; padding:100px 24px; }
.error-state i { font-size:4rem; color:#94a3b8; margin-bottom:24px; display:block; }
.error-state h2 { font-size:1.5rem; color:#64748b; margin-bottom:8px; }

@media(max-width:700px) {
  .pub-header { padding:24px 20px; }
  .pub-main { padding:20px 16px; }
  .charts-grid { grid-template-columns:1fr; }
}
</style>
</head>
<body>

<!-- Splash -->
<div class="splash" id="splash">
  <div class="spinner"></div>
  <h1>Cargando informe...</h1>
  <p>Preparando datos para tu presentación</p>
</div>

<!-- Password gate -->
<div class="password-gate" id="passwordGate" style="display:none">
  <div class="pw-card">
    <i class="fas fa-lock" style="font-size:3rem;color:#009688;margin-bottom:16px;"></i>
    <h2>Informe protegido</h2>
    <p>Este informe requiere contraseña para acceder.</p>
    <input type="password" id="pwInput" placeholder="Ingresa la contraseña..." onkeyup="if(event.key==='Enter')verifyPassword()">
    <button onclick="verifyPassword()"><i class="fas fa-unlock"></i> Acceder</button>
    <p id="pwError" style="color:#dc2626;font-size:0.82rem;margin-top:12px;display:none;">Contraseña incorrecta. Intenta de nuevo.</p>
  </div>
</div>

<!-- Main (oculto hasta cargar) -->
<div id="pubApp" style="display:none;">
  <div class="pub-header" id="pubHeader">
    <h1 id="pubTitle">—</h1>
    <div class="sub" id="pubDesc"></div>
    <div class="badge" id="pubPeriod">—</div>
  </div>

  <div class="pub-main">
    <div class="pub-tabs" id="pubTabs"></div>
    <div id="pubPanes"></div>
  </div>

  <footer>
    <p id="footerText">Informe de gestión · Confidencial</p>
    <p style="margin-top:4px;">Generado el <span id="genDate"></span></p>
  </footer>
</div>

<script>
const TOKEN = '{{ token }}';
const MONTH_NAMES = ['','Enero','Febrero','Marzo','Abril','Mayo','Junio',
  'Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

let publicData = null;
let charts = {};
let currentPassword = null;

const SECTION_LABELS = {
  general: '📊 Resumen', datosmes: '📈 Datos por mes', chats: '💬 Chats',
  llamadas: '📞 Llamadas', equipo: '👥 Equipo', calidad: '⭐ Calidad',
  soporte: '📋 Soporte', noagenda: '❌ Cancelaciones'
};

async function loadData(password = null) {
  const url = `/api/public/${TOKEN}` + (password ? `?password=${encodeURIComponent(password)}` : '');
  try {
    const res = await fetch(url);
    if (res.status === 401) {
      hideSplash();
      document.getElementById('passwordGate').style.display = 'flex';
      return;
    }
    if (res.status === 404 || res.status === 410) {
      hideSplash();
      document.getElementById('pubApp').style.display = 'block';
      document.getElementById('pubApp').innerHTML = `
        <div class="error-state">
          <i class="fas fa-link-slash"></i>
          <h2>Enlace no disponible</h2>
          <p style="color:#94a3b8;">Este enlace no existe, fue desactivado o expiró.</p>
        </div>`;
      return;
    }
    if (!res.ok) throw new Error('Error');
    publicData = await res.json();
    hideSplash();
    renderApp();
  } catch(e) {
    hideSplash();
    document.getElementById('pubApp').style.display = 'block';
    document.getElementById('pubApp').innerHTML = `<div class="error-state"><i class="fas fa-exclamation-triangle"></i><h2>Error al cargar</h2><p>No se pudo obtener el informe. Intenta más tarde.</p></div>`;
  }
}

function verifyPassword() {
  const pw = document.getElementById('pwInput').value;
  document.getElementById('passwordGate').style.display = 'none';
  document.getElementById('splash').style.display = 'flex';
  document.getElementById('pwError').style.display = 'none';
  loadData(pw);
}

function hideSplash() {
  const splash = document.getElementById('splash');
  splash.style.opacity = '0';
  setTimeout(() => splash.style.display = 'none', 500);
}

function renderApp() {
  const d = publicData;
  document.title = `${d.title} · ${d.client.name}`;
  document.getElementById('pubTitle').textContent = d.title;
  document.getElementById('pubDesc').textContent = d.description || '';
  document.getElementById('footerText').textContent = `${d.client.name} · Informe de gestión · Confidencial`;
  document.getElementById('genDate').textContent = new Date(d.generated_at).toLocaleDateString('es', { year:'numeric', month:'long', day:'numeric' });

  // Header color
  document.getElementById('pubHeader').style.background = `linear-gradient(135deg, #004d40, ${d.client.color})`;

  const reports = d.reports;
  if (!reports.length) {
    document.getElementById('pubPeriod').textContent = 'Sin datos disponibles';
  } else {
    document.getElementById('pubPeriod').textContent = `${MONTH_NAMES[reports[0].month]} – ${MONTH_NAMES[reports[reports.length-1].month]} ${reports[0].year}`;
  }

  // Render tabs
  const tabsEl = document.getElementById('pubTabs');
  const panesEl = document.getElementById('pubPanes');
  tabsEl.innerHTML = '';
  panesEl.innerHTML = '';

  d.visible_sections.forEach((sec, idx) => {
    const tabBtn = document.createElement('button');
    tabBtn.className = `pub-tab ${idx === 0 ? 'active' : ''}`;
    tabBtn.textContent = SECTION_LABELS[sec] || sec;
    tabBtn.onclick = () => {
      document.querySelectorAll('.pub-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.pub-pane').forEach(p => p.classList.remove('active'));
      tabBtn.classList.add('active');
      document.getElementById('pane-' + sec).classList.add('active');
      if (sec === 'general') setTimeout(() => initGeneralCharts(reports), 100);
    };
    tabsEl.appendChild(tabBtn);

    const pane = document.createElement('div');
    pane.className = `pub-pane ${idx === 0 ? 'active' : ''}`;
    pane.id = 'pane-' + sec;
    pane.innerHTML = buildPaneHTML(sec, reports) + (sec === 'general' ? buildQualitativeHTML(d.qualitative_analyses) : '');
    panesEl.appendChild(pane);
  });

  document.getElementById('pubApp').style.display = 'block';

  // Init first chart if general is first
  if (d.visible_sections[0] === 'general') {
    setTimeout(() => initGeneralCharts(reports), 200);
  }
}

function buildQualitativeHTML(qualitativeMap) {
  if (!qualitativeMap || !Object.keys(qualitativeMap).length) return '';
  
  const periods = Object.keys(qualitativeMap).sort().reverse();
  const latestPeriod = periods[0];
  const q = qualitativeMap[latestPeriod];
  
  if (!q || (!q.critical_points && !q.warnings && !q.achievements && !q.general_info)) return '';

  return `
    <div class="section" style="margin-top:24px;">
      <h2 class="section-title"><i class="fas fa-brain"></i> Análisis Cualitativo RC506 (${latestPeriod})</h2>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-top:16px;">
        ${q.critical_points ? `
        <div style="background:#fef2f2;border:1px solid #fecaca;border-radius:16px;padding:18px;">
          <div style="font-weight:700;color:#991b1b;margin-bottom:6px;">🔴 PUNTOS CRÍTICOS</div>
          <div style="font-size:0.85rem;color:#7f1d1d;white-space:pre-line;">${q.critical_points}</div>
        </div>` : ''}
        ${q.warnings ? `
        <div style="background:#fffbeb;border:1px solid #fde68a;border-radius:16px;padding:18px;">
          <div style="font-weight:700;color:#92400e;margin-bottom:6px;">🟡 ADVERTENCIAS</div>
          <div style="font-size:0.85rem;color:#78350f;white-space:pre-line;">${q.warnings}</div>
        </div>` : ''}
        ${q.achievements ? `
        <div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:16px;padding:18px;">
          <div style="font-weight:700;color:#166534;margin-bottom:6px;">🟢 LOGROS & ASPECTOS POSITIVOS</div>
          <div style="font-size:0.85rem;color:#14532d;white-space:pre-line;">${q.achievements}</div>
        </div>` : ''}
        ${q.general_info ? `
        <div style="background:#eff6ff;border:1px solid #bfdbfe;border-radius:16px;padding:18px;">
          <div style="font-weight:700;color:#1e40af;margin-bottom:6px;">🔵 INFORMACIÓN GENERAL</div>
          <div style="font-size:0.85rem;color:#1e3a8a;white-space:pre-line;">${q.general_info}</div>
        </div>` : ''}
      </div>
    </div>
  `;
}

function buildPaneHTML(sec, reports) {
  const mods = publicData?.client?.kpi_modules || ['chat_sales','appointments','calls','quality_kidoz'];
  
  if (sec === 'general') {
    if (mods.includes('petopia_vol')) {
      const totYeastar = reports.reduce((s,r) => s + (r.extra_data?.yeastar_calls || r.total_calls || 0), 0);
      const totBotmaker = reports.reduce((s,r) => s + (r.extra_data?.botmaker_interactions || 0), 0);
      const totCombined = totYeastar + totBotmaker;
      const avgMonthly = Math.round(totCombined / (reports.length || 1));
      return `
        <div class="section">
          <h2 class="section-title"><i class="fas fa-chart-line"></i> Resumen de Volumen · Yeastar & Botmaker</h2>
          <div class="kpi-grid">
            <div class="kpi-card"><div class="kpi-number">${totCombined.toLocaleString('es')}</div><div class="kpi-label">Total Interacciones</div></div>
            <div class="kpi-card"><div class="kpi-number">${totYeastar.toLocaleString('es')}</div><div class="kpi-label">Yeastar (Agentes)</div></div>
            <div class="kpi-card"><div class="kpi-number">${totBotmaker.toLocaleString('es')}</div><div class="kpi-label">Botmaker (Bot)</div></div>
            <div class="kpi-card"><div class="kpi-number">${avgMonthly.toLocaleString('es')}</div><div class="kpi-label">Promedio mensual</div></div>
          </div>
        </div>
        <div class="charts-grid">
          <div class="chart-card"><h3><i class="fas fa-bar-chart"></i> Volumen Yeastar (Agentes) vs Botmaker (Bot)</h3><canvas id="pub-ch-yb"></canvas></div>
          <div class="chart-card"><h3><i class="fas fa-chart-line"></i> Evolución de Interacciones Totales</h3><canvas id="pub-ch-tot"></canvas></div>
        </div>`;
    } else {
      const totChats = reports.reduce((s,r)=>s+r.chats,0);
      const totLeads = reports.reduce((s,r)=>s+r.leads,0);
      const totSales = reports.reduce((s,r)=>s+r.sales,0);
      const avgCierre = totLeads ? (totSales/totLeads*100).toFixed(1) : '0';
      const avgCsat = reports.length ? (reports.reduce((s,r)=>s+r.csat,0)/reports.length).toFixed(2) : '—';
      return `
        <div class="section">
          <h2 class="section-title"><i class="fas fa-chart-line"></i> KPIs globales acumulados</h2>
          <div class="kpi-grid">
            <div class="kpi-card"><div class="kpi-number">${totChats.toLocaleString('es')}</div><div class="kpi-label">Chats gestionados</div></div>
            <div class="kpi-card"><div class="kpi-number">${totLeads.toLocaleString('es')}</div><div class="kpi-label">Leads generados</div></div>
            <div class="kpi-card"><div class="kpi-number">${totSales.toLocaleString('es')}</div><div class="kpi-label">Ventas cerradas</div></div>
            <div class="kpi-card"><div class="kpi-number">${avgCierre}%</div><div class="kpi-label">Efectividad de cierre</div></div>
            <div class="kpi-card"><div class="kpi-number">${avgCsat}</div><div class="kpi-label">CSAT promedio</div></div>
          </div>
        </div>
        <div class="charts-grid">
          <div class="chart-card"><h3><i class="fas fa-chart-line"></i> Evolución de Chats</h3><canvas id="pub-ch-chats"></canvas></div>
          <div class="chart-card"><h3><i class="fas fa-chart-bar"></i> Ventas por mes</h3><canvas id="pub-ch-ventas"></canvas></div>
          <div class="chart-card"><h3><i class="fas fa-percent"></i> Tasa de Cierre (%)</h3><canvas id="pub-ch-cierre"></canvas></div>
          <div class="chart-card"><h3><i class="fas fa-star"></i> CSAT mensual</h3><canvas id="pub-ch-csat"></canvas></div>
        </div>`;
    }
  }

  if (sec === 'datosmes') {
    if (mods.includes('petopia_vol')) {
      return `
        <div class="section">
          <h2 class="section-title"><i class="fas fa-table"></i> Consolidado Mensual Yeastar + Botmaker</h2>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Mes</th><th>Yeastar (Agentes)</th><th>Botmaker (Bot)</th><th>Total Interacciones</th><th>Var. %</th></tr></thead>
              <tbody>${reports.map((r,i) => {
                const yVal = r.extra_data?.yeastar_calls || r.total_calls || 0;
                const bVal = r.extra_data?.botmaker_interactions || 0;
                const tot = yVal + bVal;
                const prevY = reports[i-1] ? (reports[i-1].extra_data?.yeastar_calls || reports[i-1].total_calls || 0) + (reports[i-1].extra_data?.botmaker_interactions || 0) : null;
                const pctVar = prevY ? (((tot - prevY) / prevY) * 100).toFixed(1) : null;
                return `<tr>
                  <td><strong>${r.month_name} ${r.year}</strong></td>
                  <td>${yVal.toLocaleString('es')}</td>
                  <td>${bVal.toLocaleString('es')}</td>
                  <td><strong>${tot.toLocaleString('es')}</strong></td>
                  <td>${pctVar !== null ? `<span class="${pctVar>=0?'trend-up':'trend-dn'}">${pctVar>=0?'+':''}${pctVar}%</span>` : '—'}</td>
                </tr>`;
              }).join('')}</tbody>
            </table>
          </div>
        </div>`;
    } else {
      return `
        <div class="section">
          <h2 class="section-title"><i class="fas fa-table"></i> Datos consolidados por mes</h2>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Mes</th><th>Chats</th><th>Leads</th><th>Ventas</th><th>% Cierre</th><th>Conf. Citas</th><th>Soporte</th><th>CSAT</th><th>Llamadas</th><th>KIDOZ%</th></tr></thead>
              <tbody>${reports.map(r => `
                <tr>
                  <td><strong>${r.month_name} ${r.year}</strong></td>
                  <td>${r.chats.toLocaleString('es')}</td>
                  <td>${r.leads.toLocaleString('es')}</td>
                  <td>${r.sales.toLocaleString('es')}</td>
                  <td>${r.closing_rate}%</td>
                  <td>${r.appointment_confirmations.toLocaleString('es')}</td>
                  <td>${r.support.toLocaleString('es')}</td>
                  <td>${r.csat}</td>
                  <td>${r.total_calls.toLocaleString('es')}</td>
                  <td>${r.kidoz_optimal_pct}%</td>
                </tr>`).join('')}
              </tbody>
            </table>
          </div>
        </div>`;
    }
  }

  if (sec === 'chats') return `
    <div class="section">
      <h2 class="section-title"><i class="fas fa-comments"></i> Evolución mensual · Chats</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Mes</th><th>Chats</th><th>Var.</th><th>Leads</th><th>Ventas</th><th>% Cierre</th><th>CSAT</th></tr></thead>
          <tbody>${reports.map((r,i) => {
            const prev = reports[i-1];
            const v = prev ? r.chats - prev.chats : null;
            return `<tr>
              <td><strong>${r.month_name}</strong></td>
              <td>${r.chats.toLocaleString('es')}</td>
              <td>${v === null ? '—' : `<span class="${v>=0?'trend-up':'trend-dn'}">${v>=0?'+':''}${v}</span>`}</td>
              <td>${r.leads.toLocaleString('es')}</td>
              <td>${r.sales.toLocaleString('es')}</td>
              <td>${r.closing_rate}%</td>
              <td>${r.csat}</td>
            </tr>`;
          }).join('')}</tbody>
        </table>
      </div>
    </div>`;

  if (sec === 'llamadas') return `
    <div class="section">
      <h2 class="section-title"><i class="fas fa-phone-alt"></i> Evolución mensual · Llamadas</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Mes</th><th>Total</th><th>Contestadas</th><th>% Contacto</th><th>Entrantes</th><th>% Éxito ent.</th><th>Salientes</th><th>% Éxito sal.</th></tr></thead>
          <tbody>${reports.map(r => {
            const pctIn = r.inbound_calls ? (r.inbound_answered/r.inbound_calls*100).toFixed(1)+'%' : '—';
            const pctOut = r.outbound_calls ? (r.outbound_answered/r.outbound_calls*100).toFixed(1)+'%' : '—';
            return `<tr>
              <td><strong>${r.month_name}</strong></td>
              <td>${r.total_calls.toLocaleString('es')}</td>
              <td>${r.answered_calls.toLocaleString('es')}</td>
              <td>${r.contact_rate}%</td>
              <td>${r.inbound_calls.toLocaleString('es')}</td>
              <td>${pctIn}</td>
              <td>${r.outbound_calls.toLocaleString('es')}</td>
              <td>${pctOut}</td>
            </tr>`;
          }).join('')}</tbody>
        </table>
      </div>
    </div>`;

  if (sec === 'equipo') return `
    <div class="section">
      <h2 class="section-title"><i class="fas fa-users"></i> Desempeño del equipo</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Mes</th><th>Chats</th><th>Leads</th><th>Ventas</th><th>% Cierre</th><th>Conf. Citas</th><th>CSAT</th></tr></thead>
          <tbody>${reports.map(r => `<tr>
            <td><strong>${r.month_name}</strong></td>
            <td>${r.chats.toLocaleString('es')}</td>
            <td>${r.leads.toLocaleString('es')}</td>
            <td>${r.sales.toLocaleString('es')}</td>
            <td>${r.closing_rate}%</td>
            <td>${r.appointment_confirmations.toLocaleString('es')}</td>
            <td>${r.csat}</td>
          </tr>`).join('')}</tbody>
        </table>
      </div>
      <div class="insight">📊 <strong>CSAT promedio:</strong> ${reports.length ? (reports.reduce((s,r)=>s+r.csat,0)/reports.length).toFixed(2) : '—'}/5 — Refleja una satisfacción consistente a lo largo del período.</div>
    </div>`;

  if (sec === 'calidad') return `
    <div class="section">
      <h2 class="section-title"><i class="fas fa-star"></i> Calidad de atención</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Mes</th><th>Óptimas</th><th>Aceptables</th><th>Deficientes</th><th>Total eval.</th><th>% Óptimo</th></tr></thead>
          <tbody>${reports.map(r => `<tr>
            <td><strong>${r.month_name}</strong></td>
            <td>${r.kidoz_optimal_calls + r.kidoz_optimal_chats}</td>
            <td>${r.kidoz_acceptable_calls + r.kidoz_acceptable_chats}</td>
            <td>${r.kidoz_deficient_calls + r.kidoz_deficient_chats}</td>
            <td>${r.kidoz_total_evaluations}</td>
            <td><strong>${r.kidoz_optimal_pct}%</strong></td>
          </tr>`).join('')}</tbody>
        </table>
      </div>
    </div>`;

  if (sec === 'noagenda') return `
    <div class="section">
      <h2 class="section-title"><i class="fas fa-calendar-times"></i> Cancelaciones y no agendamiento</h2>
      <p style="color:#64748b;font-size:0.85rem;margin-bottom:16px;">
        Los datos detallados de cancelaciones se registran mensualmente y pueden revisarse en el panel de gestión.
      </p>
      <div class="insight">📌 Para ver el análisis completo de cancelaciones, solicita el informe detallado al equipo de gestión.</div>
    </div>`;

  return `<div class="section"><p style="color:#94a3b8;">Sección no disponible en este informe.</p></div>`;
}

function initGeneralCharts(reports) {
  const mods = publicData?.client?.kpi_modules || ['chat_sales','appointments','calls','quality_kidoz'];
  const labels = reports.map(r => MONTH_NAMES[r.month].substring(0,3));

  if (mods.includes('petopia_vol')) {
    renderChart('pub-ch-yb','bar',labels,[
      {label:'Yeastar (Agentes)',data:reports.map(r=>r.extra_data?.yeastar_calls || r.total_calls || 0),backgroundColor:'#3b7cff'},
      {label:'Botmaker (Bot)',data:reports.map(r=>r.extra_data?.botmaker_interactions || 0),backgroundColor:'#f59e0b'}
    ]);
    renderChart('pub-ch-tot','line',labels,[{label:'Total Interacciones',data:reports.map(r=>(r.extra_data?.yeastar_calls || r.total_calls || 0)+(r.extra_data?.botmaker_interactions || 0)),borderColor:'#009688',backgroundColor:'rgba(0,150,136,0.1)',fill:true,tension:0.3}]);
  } else {
    renderChart('pub-ch-chats','line',labels,[{label:'Chats',data:reports.map(r=>r.chats),borderColor:'#009688',backgroundColor:'rgba(0,150,136,0.1)',fill:true,tension:0.3}]);
    renderChart('pub-ch-ventas','bar',labels,[{label:'Ventas',data:reports.map(r=>r.sales),backgroundColor:'#00695c'}]);
    renderChart('pub-ch-cierre','line',labels,[{label:'% Cierre',data:reports.map(r=>r.closing_rate),borderColor:'#f59e0b',tension:0.3}]);
    renderChart('pub-ch-csat','line',labels,[{label:'CSAT',data:reports.map(r=>r.csat),borderColor:'#8b5cf6',tension:0.3}],{y:{min:0,max:5}});
  }
}

function renderChart(id, type, labels, datasets, scales={}) {
  const el = document.getElementById(id);
  if (!el) return;
  if (charts[id]) charts[id].destroy();
  charts[id] = new Chart(el, {
    type, data: { labels, datasets },
    options: { responsive:true, maintainAspectRatio:true, scales }
  });
}

// Init
loadData();
</script>
</body>
