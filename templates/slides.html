<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Presentación · Dashboard Reportes</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; overflow:hidden; font-family:'Inter',sans-serif; background:#0f172a; }

/* ── Slide system ── */
.slideshow { width:100vw; height:100vh; position:relative; }
.slide {
  position:absolute; inset:0; display:none;
  flex-direction:column; padding:60px;
  animation:slideIn 0.4s ease;
}
.slide.active { display:flex; }
@keyframes slideIn { from{opacity:0;transform:translateX(30px)} to{opacity:1;transform:translateX(0)} }
@keyframes slideOut { from{opacity:1;transform:translateX(0)} to{opacity:0;transform:translateX(-30px)} }

/* ── Slide: Cover ── */
.slide-cover {
  background: linear-gradient(145deg, #004d40 0%, #009688 50%, #004d40 100%);
  color: white; align-items:center; justify-content:center; text-align:center;
}
.cover-icon { font-size:5rem; margin-bottom:24px; opacity:0.9; }
.cover-title { font-size:3.5rem; font-weight:800; line-height:1.1; }
.cover-subtitle { font-size:1.3rem; opacity:0.85; margin-top:16px; }
.cover-period { font-size:1.1rem; opacity:0.7; margin-top:8px; }
.cover-meta { display:flex; gap:20px; margin-top:48px; }
.cover-kpi { background:rgba(255,255,255,0.15); border-radius:16px; padding:20px 32px; text-align:center; }
.cover-kpi .num { font-size:2.2rem; font-weight:800; }
.cover-kpi .lbl { font-size:0.75rem; opacity:0.8; text-transform:uppercase; }

/* ── Slide: Content ── */
.slide-content {
  background: #f8fafc;
}
.slide-header {
  display:flex; align-items:center; gap:16px; margin-bottom:36px;
  padding-bottom:20px; border-bottom:3px solid #009688;
}
.slide-num {
  width:48px; height:48px; background:#009688; border-radius:14px;
  display:flex; align-items:center; justify-content:center;
  color:white; font-weight:800; font-size:1.1rem; flex-shrink:0;
}
.slide-title { font-size:2rem; font-weight:800; color:#1e2a3e; }
.slide-body { flex:1; overflow:auto; }

/* ── Dark slide ── */
.slide-dark { background:#1e2a3e; color:white; }
.slide-dark .slide-header { border-bottom-color:#009688; }
.slide-dark .slide-title { color:white; }
.slide-dark th { background:#263549; color:#94a3b8; }
.slide-dark td { border-color:#2d3f52; }
.slide-dark table { color:white; }

/* ── KPI grid in slides ── */
.s-kpi-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:16px; margin-bottom:28px; }
.s-kpi { background:white; border-radius:16px; padding:20px; text-align:center;
  border-bottom:3px solid #009688; box-shadow:0 2px 8px rgba(0,0,0,0.06); }
.s-kpi .num { font-size:2rem; font-weight:800; color:#00695c; }
.s-kpi .lbl { font-size:0.68rem; text-transform:uppercase; color:#64748b; margin-top:6px; letter-spacing:0.5px; }

/* Dark kpi */
.slide-dark .s-kpi { background:#263549; }
.slide-dark .s-kpi .num { color:#4db6ac; }
.slide-dark .s-kpi .lbl { color:#94a3b8; }

/* ── Charts in slides ── */
.s-charts { display:grid; grid-template-columns:repeat(2,1fr); gap:20px; flex:1; }
.s-chart-card { background:white; border-radius:16px; padding:18px; border:1px solid #e2e8f0; }
.s-chart-card h4 { font-size:0.85rem; font-weight:600; color:#64748b; margin-bottom:12px; }
.slide-dark .s-chart-card { background:#263549; border-color:#2d3f52; }
.slide-dark .s-chart-card h4 { color:#94a3b8; }

/* ── Table in slide ── */
.s-table-wrap { overflow-x:auto; border-radius:12px; border:1px solid #e2e8f0; }
table { width:100%; border-collapse:collapse; font-size:0.8rem; }
th { background:#f8fafc; padding:10px 12px; font-weight:600; border-bottom:2px solid #e2e8f0;
  text-align:left; color:#475569; font-size:0.72rem; text-transform:uppercase; }
td { padding:9px 12px; border-bottom:1px solid #f1f5f9; }
.trend-up { color:#10b981; font-weight:600; }
.trend-dn { color:#f59e0b; font-weight:600; }

/* ── Navigation ── */
.nav-bar {
  position:fixed; bottom:0; left:0; right:0; height:60px;
  background:rgba(15,23,42,0.95); backdrop-filter:blur(12px);
  display:flex; align-items:center; justify-content:space-between;
  padding:0 40px; z-index:100;
}
.nav-progress { display:flex; gap:6px; align-items:center; }
.prog-dot {
  width:8px; height:8px; border-radius:50%; background:rgba(255,255,255,0.3);
  cursor:pointer; transition:all 0.2s;
}
.prog-dot.active { background:#009688; width:24px; border-radius:4px; }
.nav-btn {
  background:rgba(255,255,255,0.1); border:none; color:white; padding:10px 20px;
  border-radius:10px; cursor:pointer; font-size:0.9rem; font-weight:600;
  transition:background 0.2s; display:flex; align-items:center; gap:8px;
  font-family:'Inter',sans-serif;
}
.nav-btn:hover { background:rgba(255,255,255,0.2); }
.nav-btn:disabled { opacity:0.3; cursor:not-allowed; }
.slide-counter { color:rgba(255,255,255,0.6); font-size:0.85rem; font-weight:600; }

/* ── Top bar ── */
.top-bar {
  position:fixed; top:0; left:0; right:0; height:50px;
  background:rgba(15,23,42,0.85); backdrop-filter:blur(12px);
  display:flex; align-items:center; justify-content:space-between;
  padding:0 32px; z-index:100;
}
.top-bar-title { color:rgba(255,255,255,0.8); font-size:0.85rem; font-weight:600; }
.top-bar-actions { display:flex; gap:10px; }
.top-btn {
  background:rgba(255,255,255,0.1); border:none; color:white; padding:7px 14px;
  border-radius:8px; cursor:pointer; font-size:0.8rem; font-weight:600;
  transition:background 0.2s; font-family:'Inter',sans-serif;
}
.top-btn:hover { background:rgba(255,255,255,0.2); }

/* ── Responsive ── */
@media(max-width:900px) {
  .s-kpi-grid { grid-template-columns:repeat(3,1fr); }
  .s-charts { grid-template-columns:1fr; }
  .slide { padding:30px 20px 70px; }
  .cover-title { font-size:2rem; }
}
</style>
</head>
<body>

<div class="top-bar">
  <div class="top-bar-title" id="topTitle">Cargando presentación...</div>
  <div class="top-bar-actions">
    <button class="top-btn" onclick="history.back()"><i class="fas fa-arrow-left"></i> Volver</button>
    <button class="top-btn" onclick="toggleFullscreen()"><i class="fas fa-expand"></i> Pantalla completa</button>
  </div>
</div>

<div class="slideshow" id="slideshow" style="padding-top:50px;padding-bottom:60px;"></div>

<div class="nav-bar">
  <button class="nav-btn" id="prevBtn" onclick="changeSlide(-1)" disabled>
    <i class="fas fa-chevron-left"></i> Anterior
  </button>
  <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
    <div class="slide-counter" id="slideCounter">1 / 1</div>
    <div class="nav-progress" id="navProgress"></div>
  </div>
  <button class="nav-btn" id="nextBtn" onclick="changeSlide(1)">
    Siguiente <i class="fas fa-chevron-right"></i>
  </button>
</div>

<script>
const clientId = {{ client_id }};
let TOKEN = localStorage.getItem('token');
let reports = [];
let slides = [];
let currentSlide = 0;
let charts = {};

const MONTH_NAMES = ['','Enero','Febrero','Marzo','Abril','Mayo','Junio',
  'Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

const headers = () => ({ 'Content-Type':'application/json', 'Authorization':'Bearer '+TOKEN });

async function init() {
  if (!TOKEN) { window.location.href = '/'; return; }
  const res = await fetch(`/api/clients/${clientId}/reports`, { headers: headers() });
  if (res.status === 401) { window.location.href = '/'; return; }
  if (!res.ok) { document.getElementById('slideshow').innerHTML = '<p style="color:white;text-align:center;padding:100px">Error al cargar datos.</p>'; return; }
  reports = await res.json();

  const cRes = await fetch(`/api/clients/${clientId}`, { headers: headers() });
  const client = cRes.ok ? await cRes.json() : { name: 'Cliente', color: '#009688' };

  buildSlides(client);
}

function buildSlides(client) {
  const ss = document.getElementById('slideshow');
  const mods = client.kpi_modules || ['chat_sales','appointments','calls','quality_kidoz'];
  const period = reports.length ? `${MONTH_NAMES[reports[0].month]} – ${MONTH_NAMES[reports[reports.length-1].month]} ${reports[0].year}` : '—';
  const labels = reports.map(r => MONTH_NAMES[r.month].substring(0,3));

  document.getElementById('topTitle').textContent = `${client.name} · ${period}`;

  let coverKpiHTML = '';
  let slide1KpiHTML = '';
  let slide1ChartsHTML = '';
  let slide2TableHTML = '';
  let slide3ChartsHTML = '';

  if (mods.includes('petopia_vol')) {
    const totYeastar = reports.reduce((s,r) => s + (r.extra_data?.yeastar_calls || r.total_calls || 0), 0);
    const totBotmaker = reports.reduce((s,r) => s + (r.extra_data?.botmaker_interactions || 0), 0);
    const totCombined = totYeastar + totBotmaker;
    const avgMonthly = Math.round(totCombined / (reports.length || 1));

    coverKpiHTML = `
      <div class="cover-kpi"><div class="num">${totCombined.toLocaleString('es')}</div><div class="lbl">Total Interacciones</div></div>
      <div class="cover-kpi"><div class="num">${totYeastar.toLocaleString('es')}</div><div class="lbl">Yeastar (Agentes)</div></div>
      <div class="cover-kpi"><div class="num">${totBotmaker.toLocaleString('es')}</div><div class="lbl">Botmaker (Bot)</div></div>
      <div class="cover-kpi"><div class="num">${avgMonthly.toLocaleString('es')}</div><div class="lbl">Promedio mensual</div></div>
    `;

    slide1KpiHTML = `
      <div class="s-kpi"><div class="num">${totCombined.toLocaleString('es')}</div><div class="lbl">Total Interacciones</div></div>
      <div class="s-kpi"><div class="num">${totYeastar.toLocaleString('es')}</div><div class="lbl">Yeastar Agentes</div></div>
      <div class="s-kpi"><div class="num">${totBotmaker.toLocaleString('es')}</div><div class="lbl">Botmaker Bot</div></div>
      <div class="s-kpi"><div class="num">${avgMonthly.toLocaleString('es')}</div><div class="lbl">Promedio mensual</div></div>
    `;

    slide1ChartsHTML = `
      <div class="s-chart-card"><h4><i class="fas fa-bar-chart"></i> Volumen Yeastar (Agentes) vs Botmaker (Bot)</h4><canvas id="s-ch-yb"></canvas></div>
      <div class="s-chart-card"><h4><i class="fas fa-chart-line"></i> Evolución de Interacciones Totales</h4><canvas id="s-ch-tot"></canvas></div>
    `;

    slide2TableHTML = `
      <table>
        <thead><tr><th>Mes</th><th>Yeastar (Agentes)</th><th>Botmaker (Bot)</th><th>Total Interacciones</th><th>Var. %</th></tr></thead>
        <tbody>${reports.map((r,i) => {
          const yVal = r.extra_data?.yeastar_calls || r.total_calls || 0;
          const bVal = r.extra_data?.botmaker_interactions || 0;
          const tot = yVal + bVal;
          const prevY = reports[i-1] ? (reports[i-1].extra_data?.yeastar_calls || reports[i-1].total_calls || 0) + (reports[i-1].extra_data?.botmaker_interactions || 0) : null;
          const pctVar = prevY ? (((tot - prevY) / prevY) * 100).toFixed(1) : null;
          return `<tr>
            <td><strong>${MONTH_NAMES[r.month]} ${r.year}</strong></td>
            <td>${yVal.toLocaleString('es')}</td>
            <td>${bVal.toLocaleString('es')}</td>
            <td><strong>${tot.toLocaleString('es')}</strong></td>
            <td>${pctVar !== null ? `<span class="${pctVar>=0?'trend-up':'trend-dn'}">${pctVar>=0?'+':''}${pctVar}%</span>` : '—'}</td>
          </tr>`;
        }).join('')}</tbody>
      </table>
    `;

    slide3ChartsHTML = `
      <div class="s-chart-card"><h4><i class="fas fa-chart-bar"></i> Distribución Mensual Agentes vs Bot</h4><canvas id="s-ch-yb-dist"></canvas></div>
      <div class="s-chart-card"><h4><i class="fas fa-arrow-trend-up"></i> Tendencia de Volumen</h4><canvas id="s-ch-trend"></canvas></div>
    `;
  } else {
    const totChats = reports.reduce((s,r) => s+r.chats, 0);
    const totSales = reports.reduce((s,r) => s+r.sales, 0);
    const totLeads = reports.reduce((s,r) => s+r.leads, 0);
    const avgCierre = totLeads ? (totSales/totLeads*100).toFixed(1) : '0';
    const avgCsat = reports.length ? (reports.reduce((s,r)=>s+r.csat,0)/reports.length).toFixed(2) : '—';

    coverKpiHTML = `
      <div class="cover-kpi"><div class="num">${totChats.toLocaleString('es')}</div><div class="lbl">Chats gestionados</div></div>
      <div class="cover-kpi"><div class="num">${totSales.toLocaleString('es')}</div><div class="lbl">Ventas cerradas</div></div>
      <div class="cover-kpi"><div class="num">${avgCierre}%</div><div class="lbl">Efectividad de cierre</div></div>
      <div class="cover-kpi"><div class="num">${avgCsat}</div><div class="lbl">CSAT promedio</div></div>
    `;

    slide1KpiHTML = `
      <div class="s-kpi"><div class="num">${totChats.toLocaleString('es')}</div><div class="lbl">Chats gestionados</div></div>
      <div class="s-kpi"><div class="num">${totLeads.toLocaleString('es')}</div><div class="lbl">Leads generados</div></div>
      <div class="s-kpi"><div class="num">${totSales.toLocaleString('es')}</div><div class="lbl">Ventas cerradas</div></div>
      <div class="s-kpi"><div class="num">${avgCierre}%</div><div class="lbl">Efectividad de cierre</div></div>
      <div class="s-kpi"><div class="num">${avgCsat}</div><div class="lbl">CSAT promedio</div></div>
    `;

    slide1ChartsHTML = `
      <div class="s-chart-card"><h4><i class="fas fa-chart-line"></i> Evolución de Chats</h4><canvas id="s-ch-chats"></canvas></div>
      <div class="s-chart-card"><h4><i class="fas fa-chart-bar"></i> Ventas por mes</h4><canvas id="s-ch-ventas"></canvas></div>
    `;

    slide2TableHTML = `
      <table>
        <thead><tr><th>Mes</th><th>Chats</th><th>Leads</th><th>Ventas</th><th>% Cierre</th><th>Conf. Citas</th><th>CSAT</th><th>Llamadas</th><th>Calidad%</th></tr></thead>
        <tbody>${reports.map((r,i) => {
          const prev = reports[i-1];
          const varCh = prev ? r.chats - prev.chats : null;
          return `<tr>
            <td><strong>${MONTH_NAMES[r.month]} ${r.year}</strong></td>
            <td>${r.chats.toLocaleString('es')}${varCh !== null ? ` <span class="${varCh>=0?'trend-up':'trend-dn'}">(${varCh>=0?'+':''}${varCh})</span>` : ''}</td>
            <td>${r.leads.toLocaleString('es')}</td>
            <td>${r.sales.toLocaleString('es')}</td>
            <td>${r.closing_rate}%</td>
            <td>${r.appointment_confirmations.toLocaleString('es')}</td>
            <td>${r.csat}</td>
            <td>${r.total_calls.toLocaleString('es')}</td>
            <td>${r.kidoz_optimal_pct}%</td>
          </tr>`;
        }).join('')}</tbody>
      </table>
    `;

    slide3ChartsHTML = `
      <div class="s-chart-card"><h4><i class="fas fa-percent"></i> Tasa de Cierre (%)</h4><canvas id="s-ch-cierre"></canvas></div>
      <div class="s-chart-card"><h4><i class="fas fa-star"></i> CSAT mensual</h4><canvas id="s-ch-csat"></canvas></div>
      <div class="s-chart-card"><h4><i class="fas fa-phone"></i> Llamadas por mes</h4><canvas id="s-ch-llamadas"></canvas></div>
      <div class="s-chart-card"><h4><i class="fas fa-shield-alt"></i> % Calidad Óptima</h4><canvas id="s-ch-kidoz"></canvas></div>
    `;
  }

  const slideDefs = [
    // Slide 0: Cover
    {
      id:'slide-cover', cls:'slide-cover',
      html: `
        <div class="cover-icon"><i class="fas fa-chart-line"></i></div>
        <div class="cover-title">Informe de Gestión</div>
        <div class="cover-subtitle">${client.name}</div>
        <div class="cover-period">${period}</div>
        <div class="cover-meta">${coverKpiHTML}</div>`
    },
    // Slide 1: KPIs
    {
      id:'slide-kpis', cls:'slide-content',
      title:'KPIs Globales', icon:'📊', num:1,
      html: `
        <div class="s-kpi-grid">${slide1KpiHTML}</div>
        <div class="s-charts">${slide1ChartsHTML}</div>`
    },
    // Slide 2: Datos mensuales
    {
      id:'slide-datosmes', cls:'slide-content slide-dark',
      title:'Datos por Mes', icon:'📈', num:2,
      html: `<div class="s-table-wrap">${slide2TableHTML}</div>`
    },
    // Slide 3: Tendencias
    {
      id:'slide-tendencias', cls:'slide-content',
      title:'Tendencias & Análisis', icon:'📉', num:3,
      html: `<div class="s-charts" style="grid-template-columns:repeat(2,1fr);">${slide3ChartsHTML}</div>`
    },
    // Slide 4: Final
    {
      id:'slide-final', cls:'slide-cover',
      html:`
        <div class="cover-icon"><i class="fas fa-check-circle"></i></div>
        <div class="cover-title">Gracias</div>
        <div class="cover-subtitle" style="margin-top:16px;">Reporte de ${client.name} preparado con datos actualizados</div>
        <div class="cover-period">${new Date().toLocaleDateString('es',{year:'numeric',month:'long',day:'numeric'})}</div>`
    }
  ];

  slideDefs.forEach((s, idx) => {
    const el = document.createElement('div');
    el.className = `slide ${s.cls}`;
    el.id = s.id;
    if (idx === 0) el.classList.add('active');

    if (s.title) {
      el.innerHTML = `
        <div class="slide-header">
          <div class="slide-num">${s.num}</div>
          <div class="slide-title">${s.icon} ${s.title}</div>
        </div>
        <div class="slide-body">${s.html}</div>`;
    } else {
      el.innerHTML = s.html;
    }
    ss.appendChild(el);
  });

  slides = slideDefs;
  buildProgress();
  updateNav();

  // Inicializar charts
  setTimeout(() => {
    if (mods.includes('petopia_vol')) {
      renderSChart('s-ch-yb','bar',labels,[
        {label:'Yeastar (Agentes)',data:reports.map(r=>r.extra_data?.yeastar_calls || r.total_calls || 0),backgroundColor:'#3b7cff'},
        {label:'Botmaker (Bot)',data:reports.map(r=>r.extra_data?.botmaker_interactions || 0),backgroundColor:'#f59e0b'}
      ]);
      renderSChart('s-ch-tot','line',labels,[{label:'Total Interacciones',data:reports.map(r=>(r.extra_data?.yeastar_calls || r.total_calls || 0)+(r.extra_data?.botmaker_interactions || 0)),borderColor:'#009688',backgroundColor:'rgba(0,150,136,0.1)',fill:true,tension:0.3}]);
      renderSChart('s-ch-yb-dist','bar',labels,[
        {label:'Agentes',data:reports.map(r=>r.extra_data?.yeastar_calls || r.total_calls || 0),backgroundColor:'rgba(59,124,255,0.6)'},
        {label:'Botmaker',data:reports.map(r=>r.extra_data?.botmaker_interactions || 0),backgroundColor:'rgba(245,158,11,0.6)'}
      ]);
      renderSChart('s-ch-trend','line',labels,[{label:'Tendencia Total',data:reports.map(r=>(r.extra_data?.yeastar_calls || r.total_calls || 0)+(r.extra_data?.botmaker_interactions || 0)),borderColor:'#3b7cff',tension:0.3}]);
    } else {
      renderSChart('s-ch-chats','line',labels,[{label:'Chats',data:reports.map(r=>r.chats),borderColor:'#009688',backgroundColor:'rgba(0,150,136,0.1)',fill:true,tension:0.3}]);
      renderSChart('s-ch-ventas','bar',labels,[{label:'Ventas',data:reports.map(r=>r.sales),backgroundColor:'#00695c'}]);
      renderSChart('s-ch-cierre','line',labels,[{label:'% Cierre',data:reports.map(r=>r.closing_rate),borderColor:'#f59e0b',tension:0.3}]);
      renderSChart('s-ch-csat','line',labels,[{label:'CSAT',data:reports.map(r=>r.csat),borderColor:'#8b5cf6',tension:0.3}],{y:{min:0,max:5}});
      renderSChart('s-ch-llamadas','bar',labels,[{label:'Llamadas',data:reports.map(r=>r.total_calls),backgroundColor:'#3b82f6'}]);
      renderSChart('s-ch-kidoz','line',labels,[{label:'% Calidad',data:reports.map(r=>r.kidoz_optimal_pct),borderColor:'#22c55e',tension:0.3}],{y:{min:80,max:100}});
    }
  }, 100);
}

function renderSChart(id, type, labels, datasets, scales = {}) {
  const el = document.getElementById(id);
  if (!el) return;
  if (charts[id]) charts[id].destroy();
  charts[id] = new Chart(el, {
    type, data: { labels, datasets },
    options: { responsive:true, maintainAspectRatio:true, scales,
      plugins:{ legend:{ labels:{ color: document.getElementById(el.closest('.slide')?.id || '')?.classList?.contains('slide-dark') ? '#fff' : '#1e2a3e' } } } }
  });
}

function buildProgress() {
  const prog = document.getElementById('navProgress');
  prog.innerHTML = slides.map((_, i) =>
    `<div class="prog-dot ${i===0?'active':''}" onclick="goTo(${i})"></div>`
  ).join('');
}

function changeSlide(dir) {
  const next = currentSlide + dir;
  if (next < 0 || next >= slides.length) return;
  goTo(next);
}

function goTo(idx) {
  document.querySelectorAll('.slide').forEach(s => s.classList.remove('active'));
  document.getElementById(slides[idx].id).classList.add('active');
  document.querySelectorAll('.prog-dot').forEach((d, i) => d.classList.toggle('active', i === idx));
  currentSlide = idx;
  document.getElementById('slideCounter').textContent = `${idx + 1} / ${slides.length}`;
  updateNav();
}

function updateNav() {
  document.getElementById('prevBtn').disabled = currentSlide === 0;
  document.getElementById('nextBtn').disabled = currentSlide === slides.length - 1;
}

function toggleFullscreen() {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen();
  else document.exitFullscreen();
}

// Teclado
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') changeSlide(1);
  if (e.key === 'ArrowLeft') changeSlide(-1);
  if (e.key === 'f' || e.key === 'F') toggleFullscreen();
});

init();
</script>
</body>
</html>
